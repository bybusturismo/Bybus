# Produção num servidor único (VPS). Uso, a partir da raiz do repositório:
#   cp implantacao/producao.env.exemplo implantacao/.env   (e preencha)
#   docker compose -f implantacao/docker-compose.yml --env-file implantacao/.env up -d --build
name: bybus

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bybus
      POSTGRES_USER: bybus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: UTC
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bybus -d bybus"]
      interval: 10s
      retries: 10

  api:
    image: bybus-api
    build: { context: .., dockerfile: implantacao/Dockerfile, target: api }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      AMBIENTE: ${AMBIENTE:-producao}
      DATABASE_URL: postgres://bybus:${POSTGRES_PASSWORD}@db:5432/bybus
      ORIGEM_WEB: https://${DOMINIO}
      PROXIES_CONFIAVEIS: "1"

  web:
    image: bybus-web
    build: { context: .., dockerfile: implantacao/Dockerfile, target: web }
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_dados:/data
      - caddy_config:/config

  # Cópia diária do banco em implantacao/backups no servidor (guarda 14 dias).
  # Copie também para fora do servidor (ver docs/implantacao.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U bybus -d bybus -Fc -f /backups/bybus-$$(date -u +%Y%m%d-%H%M).dump && echo "backup ok"
          find /backups -name 'bybus-*.dump' -mtime +14 -delete
          sleep 86400
        done

  # ---- WhatsApp pela Evolution API (OPCIONAL: só sobe com `--profile whatsapp`). NÃO oficial (WhatsApp Web/Baileys): risco de
  # bloqueio do número; use para conversar e responder, sem disparo em massa. Sem porta pública: a API fala com ela por
  # http://evolution:8080 e ela avisa a API em http://api:3333/api/interno/whatsapp/<WHATSAPP_WEBHOOK_TOKEN>.
  # Versão fixa (a 2.4.0 passa a exigir licença: avaliar antes de atualizar). Passo a passo: docs/produto/modulo-whatsapp.md.
  evolution:
    profiles: ["whatsapp"]
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-db: { condition: service_healthy }
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?defina EVOLUTION_DB_PASSWORD no .env}@evolution-db:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: bybus
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      # LGPD: nada de conteúdo de mensagem nos registros
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
      LOG_COLOR: "false"
      TELEMETRY_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      SQS_ENABLED: "false"
      CHATWOOT_ENABLED: "false"
      TYPEBOT_ENABLED: "false"
      OPENAI_ENABLED: "false"
      DIFY_ENABLED: "false"
      N8N_ENABLED: "false"
      EVOAI_ENABLED: "false"
      S3_ENABLED: "false"
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: Bybus Gestao
      CONFIG_SESSION_PHONE_NAME: Chrome
    volumes:
      - evolution_instancias:/evolution/instances
    mem_limit: 1g

  evolution-db:
    profiles: ["whatsapp"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?defina EVOLUTION_DB_PASSWORD no .env}
      TZ: UTC
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      retries: 10

volumes:
  evolution_instancias:
  evolution_pg:
  banco:
  caddy_dados:
  caddy_config:
